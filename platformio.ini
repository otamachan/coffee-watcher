; coffee-watcher: ESP32-CAM standalone coffee level watcher
; Posts to Teams via webhook when coffee level changes.

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; ESP32-WROVER-E has 4MB PSRAM; enable it.
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    bblanchon/ArduinoJson@^7.4.0
